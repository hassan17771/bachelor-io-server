# The f103-CANsim board over an already-running J-Link GDB server:
#
#   JLinkGDBServerCLExe -device STM32F103C8 -if SWD -speed 4000 -port 2331
#
# Describes the board only. Which build is flashed on it is a runtime input:
# point WCET_FIRMWARE_ELF (or run_suite's elf=) at the .elf the MMB address is
# read from.

soc:
  part: STM32F103C8T6
  backend: jlink
  probe:
    connection: server
    host: 127.0.0.1
    port: 2331
    timeout_s: 2.0

mocks:
  - name: can_bus
    class: can
